name: zencart

# Bloco comum dos 10 grupos; cada serviço só define porta, ambiente e arquivos próprios
x-web: &web
  image: zencart-local:${ZC_VERSION:-2.1.0}
  build:
    context: ./docker/web
    args:
      ZC_VERSION: ${ZC_VERSION:-2.1.0}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  networks:
    - backend
    - frontend
  # Limites por loja; a cota de disco (DISK_QUOTA_MB) é suave e verificada dentro do container
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO1_DB_PASSWORD: ${GRUPO1_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO2_DB_PASSWORD: ${GRUPO2_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO3_DB_PASSWORD: ${GRUPO3_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO4_DB_PASSWORD: ${GRUPO4_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO5_DB_PASSWORD: ${GRUPO5_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO6_DB_PASSWORD: ${GRUPO6_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO7_DB_PASSWORD: ${GRUPO7_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO8_DB_PASSWORD: ${GRUPO8_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO9_DB_PASSWORD: ${GRUPO9_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      GRUPO10_DB_PASSWORD: ${GRUPO10_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  grupo1:
    <<: *web
    ports: ["8012:80", "2212:22"]
    environment:
      DB_DATABASE: zc_grupo1
      DB_USER: grupo1
      DB_PASSWORD: ${GRUPO1_DB_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      ADMIN_USER: grupo1
      ADMIN_PASSWORD: ${GRUPO1_ADMIN_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      ZC_URL: ${GRUPO1_URL:-}
      SSH_PASSWORD: ${GRUPO1_SSH_PASSWORD:?rode ./scripts/gerar-credenciais.sh}
      DISK_QUOTA_MB: 2048
    volumes:
      - grupo1_files:/var/www/html
      - ./auth/grupo1.htpasswd:/etc/apache2/.htpasswd:ro
      - ./ssh:/run/zc-ssh-host:ro

  grupo2:
